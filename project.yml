name: TermAnywhere
options:
  bundleIdPrefix: me.tianyong
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ARCHS: arm64
    SWIFT_INCLUDE_PATHS: '$(SRCROOT)/Sources/CSSH/include'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
targets:
  CSSHMac:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/CSSH
        headerVisibility: public
    settings:
      base:
        PRODUCT_NAME: CSSHMac
        PRODUCT_MODULE_NAME: CSSH
        DEFINES_MODULE: YES
        HEADER_SEARCH_PATHS: '$(SRCROOT)/Sources/CSSH/include'
  TermCoreMac:
    type: framework
    platform: macOS
    sources: [Sources/TermCore]
    settings:
      base:
        PRODUCT_NAME: TermCore
        PRODUCT_MODULE_NAME: TermCore
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
        OTHER_LDFLAGS: ['$(inherited)', '-lz', '$(SRCROOT)/.build/native/macos/src/libssh2.a']
    dependencies:
      - target: CSSHMac
      - framework: .build/references/OpenSSL/Frameworks/OpenSSL.xcframework
        embed: false
  TermAnywhereMac:
    type: application
    platform: macOS
    sources:
      - path: MacApp
      - path: App/TermAnywhereApp.swift
      - path: App/ConfigurationSync.swift
      - path: App/TerminalSession.swift
      - path: App/CredentialsView.swift
      - path: App/SettingsView.swift
      - path: App/ThirdPartyNotices.txt
    entitlements:
      path: MacApp/TermAnywhereMac.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)', '$(AppIdentifierPrefix)me.tianyong.term-anywhere.shared']
        com.apple.developer.ubiquity-kvstore-identifier: '$(TeamIdentifierPrefix)me.tianyong.term-anywhere'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.tianyong.term-anywhere.mac
        PRODUCT_NAME: Term Anywhere
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ['$(inherited)', '-lz', '$(SRCROOT)/.build/native/macos/src/libssh2.a']
    dependencies:
      - target: TermCoreMac
        embed: false
      - target: CSSHMac
      - framework: .build/references/OpenSSL/Frameworks/OpenSSL.xcframework
        embed: true
      - package: SwiftTerm
    info:
      path: MacApp/Info.plist
      properties:
        KeychainLocalAccessGroup: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        KeychainSyncAccessGroup: $(AppIdentifierPrefix)me.tianyong.term-anywhere.shared
        CFBundleDisplayName: Term Anywhere
        LSApplicationCategoryType: public.app-category.developer-tools
        NSLocalNetworkUsageDescription: Connect to SSH servers on your local network.
  CSSH:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/CSSH
        headerVisibility: public
    settings:
      base:
        PRODUCT_NAME: CSSH
        DEFINES_MODULE: YES
        PRODUCT_MODULE_NAME: CSSH
        HEADER_SEARCH_PATHS: '$(SRCROOT)/Sources/CSSH/include'
  TermCore:
    type: framework
    platform: iOS
    sources: [Sources/TermCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
        OTHER_LDFLAGS: ['$(inherited)', '-lz', '$(SRCROOT)/.build/native/$(PLATFORM_NAME)/src/libssh2.a']
    dependencies:
      - target: CSSH
      - framework: .build/references/OpenSSL/Frameworks/OpenSSL.xcframework
        embed: false
  TermAnywhere:
    type: application
    platform: iOS
    sources: [App]
    entitlements:
      path: App/TermAnywhere.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)', '$(AppIdentifierPrefix)me.tianyong.term-anywhere.shared']
        com.apple.developer.ubiquity-kvstore-identifier: '$(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.tianyong.term-anywhere
        PRODUCT_NAME: TermAnywhere
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ['$(inherited)', '-lz', '$(SRCROOT)/.build/native/$(PLATFORM_NAME)/src/libssh2.a']
    dependencies:
      - target: TermCore
        embed: false
      - target: CSSH
      - framework: .build/references/OpenSSL/Frameworks/OpenSSL.xcframework
        embed: true
      - package: SwiftTerm
    info:
      path: App/Info.plist
      properties:
        KeychainLocalAccessGroup: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        KeychainSyncAccessGroup: $(AppIdentifierPrefix)me.tianyong.term-anywhere.shared
        CFBundleDisplayName: Term Anywhere
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: Connect to SSH servers on your local network.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  TermAnywhereMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SharedAppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Term Anywhere.app/Contents/MacOS/Term Anywhere'
        BUNDLE_LOADER: '$(TEST_HOST)'
    dependencies:
      - target: TermAnywhereMac
      - target: TermCoreMac
  TermAnywhereTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests, SharedAppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/TermAnywhere.app/TermAnywhere'
        BUNDLE_LOADER: '$(TEST_HOST)'
    dependencies:
      - target: TermAnywhere
      - target: TermCore
      - package: SwiftTerm
schemes:
  TermAnywhereMac:
    build:
      targets:
        TermAnywhereMac: all
    run:
      config: Debug
    test:
      targets: [TermAnywhereMacTests]
  TermAnywhere:
    build:
      targets:
        TermAnywhere: all
    run:
      config: Debug
    test:
      targets: [TermAnywhereTests]
